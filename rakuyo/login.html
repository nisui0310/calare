<script>
  const params = new URLSearchParams(window.location.search);
  const group = params.get("group") || "groupA";
  const nextPage = params.get("next");

  const PASSWORDS = {
    "groupA": "yes",
  };

  function verifyPassword() {
    const inputPass = document.getElementById("password-input").value.trim();
    const message = document.getElementById("message");

    if (inputPass === PASSWORDS[group]) {
      localStorage.setItem("pass-" + group, "ok");
      message.textContent = "年齢を確認しました。";
      message.style.color = "#8f8";

      setTimeout(() => {
        if (nextPage) {
          window.location.href = nextPage;
        } else {
          message.textContent = "遷移先が指定されていません。";
          message.style.color = "#f88";
        }
      }, 800);

    } else {
      message.textContent = "パスワードが違います。";
      message.style.color = "#f88";
    }
  }
</script>
